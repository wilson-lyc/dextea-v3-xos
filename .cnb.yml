# 云原生开发流水线：分支页面点击「云原生开发」按钮时创建开发环境
# 环境镜像由 .ide/Dockerfile 构建 = CNB 默认开发环境 + Go 工具链
$:
  vscode:
    - runner:
        cpus: 2
      docker:
        # 用仓库内的 Dockerfile 构建开发环境镜像；镜像按内容哈希缓存并复用，
        # .ide/Dockerfile 未变更时不会重复构建
        build: .ide/Dockerfile
        # 构建失败时的回退镜像
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        - name: 检出共享 RPC 协议
          script: git clone https://github.com/wilson-lyc/dextea-v3-proto.git ../dextea-proto
        - name: 下载 Go 依赖
          script: go mod download
        - name: 编译校验
          script: go build ./...
