# 应用配置示例：复制为 configs/config.yaml 使用（config.yaml 已被 gitignore）
# 配置值支持 ${ENV} 形式的环境变量引用

server:
  host: 0.0.0.0
  port: "8080"
  mode: debug   # debug / release / test

# MySQL
database:
  host: 127.0.0.1
  port: "3306"
  user: root
  password: "123456"
  name: gin_quickstart

# Redis
redis:
  host: 127.0.0.1
  port: "6379"
  password: ""
  db: 0
  gallery-ttl: 10m   # 图库缓存过期时间

# 对象存储源：key 为存储源名称，业务方调用上传接口时指定
storage:
  max-upload-size: 20971520   # 单文件大小上限（字节），默认 20MB
  sources:
  sources:
    minio-dev:
      vendor: minio                # minio / aws-s3 / aliyun-oss / tencent-cos / qiniu ...
      endpoint: 127.0.0.1:9000     # 不带 http(s) 前缀
      region: us-east-1
      access-key: minioadmin
      secret-key: minioadmin
      use-ssl: false
      default-bucket: gin-quickstart-dev

# OpenTelemetry 链路追踪
# OTLP 导出端点等通过标准 OTEL_* 环境变量配置
telemetry:
  enable: true
  service-name: gin-quickstart
  service-version: 0.1.0
